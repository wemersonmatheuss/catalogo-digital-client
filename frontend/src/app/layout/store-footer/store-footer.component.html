<footer class="footer">
  <div class="inner">
    <div class="cols">
      <section>
        <h2>{{ site().footer.aboutTitle }}</h2>
        <p>{{ site().footer.aboutText }}</p>
      </section>
      <section>
        <h2>{{ site().footer.catalogTitle }}</h2>
        <nav aria-label="Atalhos do catálogo">
          @for (item of site().nav; track item.id) {
            <a [routerLink]="item.href">{{ item.label }}</a>
          }
        </nav>
      </section>
      <section>
        <h2>{{ site().footer.contactTitle }}</h2>
        <p>{{ site().footer.city }}</p>
        @if (whatsapp) {
          <a class="wa" [href]="whatsapp" target="_blank" rel="noopener noreferrer">{{ site().footer.whatsappLabel }}</a>
        }
      </section>
    </div>
  </div>
  <p class="mark" aria-hidden="true">{{ site().footer.mark }}</p>
</footer>
<app-whatsapp-button class="float" [label]="site().footer.floatLabel" variant="float" />
